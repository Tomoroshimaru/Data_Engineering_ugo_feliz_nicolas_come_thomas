version: 2

models:
  - name: int_order_items
    description: "{{ doc('int_order_items') }}"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [order_id, p_id]
    columns:
      - name: order_id
        description: "{{ doc('order_id') }}"
      - name: p_id
        description: "{{ doc('p_id') }}"
      - name: qty
        description: "Units of the product in the order."
      - name: price_at_purchase
        description: "Unit price paid."
      - name: order_date
        description: "{{ doc('order_date') }}"
        data_tests:
          - not_null

  - name: int_product_ratings
    description: "{{ doc('int_product_ratings') }}"
    columns:
      - name: p_id
        description: "{{ doc('p_id') }}"
        data_tests:
          - not_null
          - unique
      - name: avg_rating
        description: "{{ doc('avg_rating') }}"
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 5
      - name: n_reviews
        description: "{{ doc('n_reviews') }}"
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
