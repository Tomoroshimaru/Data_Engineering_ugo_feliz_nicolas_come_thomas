version: 2

models:
  - name: fct_order_items
    description: "{{ doc('fct_order_items') }}"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [order_id, p_id]
    columns:
      - name: order_id
        description: "{{ doc('order_id') }}"
      - name: p_id
        description: "{{ doc('p_id') }}"
      - name: order_date
        description: "{{ doc('order_date') }}"
      - name: qty
        description: "Units of the product in the order."
      - name: price_at_purchase
        description: "Unit price paid."
      - name: line_revenue
        description: "{{ doc('line_revenue') }}"
      - name: avg_rating
        description: "{{ doc('avg_rating') }}"
      - name: n_reviews
        description: "{{ doc('n_reviews') }}"

  - name: fct_daily_demand
    description: "{{ doc('fct_daily_demand') }}"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [p_id, order_date]
    columns:
      - name: p_id
        description: "{{ doc('p_id') }}"
      - name: order_date
        description: "{{ doc('order_date') }}"
        data_tests:
          - not_null
      - name: units
        description: "{{ doc('units') }}"
        data_tests:
          - not_null
      - name: revenue
        description: "{{ doc('revenue') }}"

  - name: fct_daily_demand_fixed
    description: "{{ doc('fct_daily_demand_fixed') }}"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [p_id, order_date]
    columns:
      - name: p_id
        description: "{{ doc('p_id') }}"
        data_tests:
          - not_null
      - name: order_date
        description: "{{ doc('order_date') }}"
        data_tests:
          - not_null
      - name: units_sold
        description: "{{ doc('units') }}"
        data_tests:
          - sum_matches:
              arguments:
                compare_model: ref('int_order_items')
                compare_expression: qty
      - name: revenue
        description: "{{ doc('revenue') }}"
        data_tests:
          - sum_matches:
              arguments:
                compare_model: ref('int_order_items')
                compare_expression: qty * price_at_purchase
      - name: avg_rating
        description: "{{ doc('avg_rating') }}"
      - name: review_count
        description: "{{ doc('n_reviews') }}"
